<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portal Runner</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #fff; --text: #1d2330; --muted: #667085; --line: #e3e6eb;
    --accent: #2f6fde; --ok: #1f8a4c; --bad: #c4372d; --run: #b7791f; --wait: #667085;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #14171c; --panel: #1c2027; --text: #e6e8ec; --muted: #9aa3b2; --line: #2c323c;
            --accent: #6b9cff; --ok: #4cc27f; --bad: #ff7a70; --run: #f0b85c; --wait: #9aa3b2; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.45 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
         background: var(--bg); color: var(--text); }
  header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 16px; padding: 16px 24px;
           border-bottom: 1px solid var(--line); }
  header h1 { font-size: 18px; margin: 0; }
  header .health { color: var(--muted); }
  header a { margin-left: auto; color: var(--accent); }
  main { display: grid; grid-template-columns: minmax(300px, 380px) 1fr; gap: 20px; padding: 20px 24px; }
  @media (max-width: 860px) { main { grid-template-columns: 1fr; padding: 16px; } header { padding: 12px 16px; } }
  @media (max-width: 600px) { .wide { display: none; } }
  .table-wrap { overflow-x: auto; }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; }
  h2 { font-size: 15px; margin: 0 0 12px; }
  label { display: block; font-size: 12px; color: var(--muted); margin: 10px 0 4px; }
  input, select, textarea { width: 100%; padding: 7px 9px; border: 1px solid var(--line); border-radius: 6px;
                            background: var(--bg); color: var(--text); font: inherit; }
  .row { display: grid; grid-template-columns: 1fr 72px 28px; gap: 6px; margin-bottom: 6px; }
  button { font: inherit; border: 1px solid var(--line); background: var(--panel); color: var(--text);
           border-radius: 6px; padding: 7px 12px; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; width: 100%; margin-top: 14px; }
  button:disabled { opacity: .6; cursor: default; }
  .message { margin-top: 10px; font-size: 13px; }
  .message.error { color: var(--bad); }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-size: 12px; color: var(--muted); font-weight: 600; }
  tbody tr { cursor: pointer; }
  tbody tr:hover, tbody tr.selected { background: var(--bg); }
  .badge { display: inline-block; padding: 1px 8px; border-radius: 99px; font-size: 12px; font-weight: 600;
           border: 1px solid currentColor; }
  .queued { color: var(--wait); } .running { color: var(--run); }
  .succeeded, .ok { color: var(--ok); } .failed { color: var(--bad); }
  .muted { color: var(--muted); }
  .links a { color: var(--accent); margin-right: 10px; }
  #detail { margin-top: 16px; }
  #detail ol { padding-left: 18px; margin: 8px 0 0; }
  #detail li { margin: 4px 0; }
  .error-text { color: var(--bad); white-space: pre-wrap; font-size: 12px; }
  .empty { color: var(--muted); padding: 16px 0; }
</style>
</head>
<body>
<header>
  <h1>Portal Runner</h1>
  <span class="health" id="health">connecting…</span>
  <a href="/docs" target="_blank" rel="noopener">API docs</a>
</header>

<main>
  <section>
    <h2>New invoice job</h2>
    <form id="form">
      <label for="number">Invoice number</label>
      <input id="number" required pattern="[A-Za-z0-9][A-Za-z0-9_\-]{0,30}" placeholder="ASSIGN-000105">
      <label for="customer">Customer</label>
      <input id="customer" required placeholder="Test Customer A">
      <label for="date">Invoice date</label>
      <input id="date" type="date" required>
      <label for="terms">Terms (sets the due date)</label>
      <select id="terms">
        <option>Due on Receipt</option><option>Net 15</option><option>Net 30</option><option>Net 45</option>
        <option>Net 60</option><option>Due end of the month</option><option>Due end of next month</option>
      </select>
      <label>Items (name, quantity)</label>
      <div id="items"></div>
      <button type="button" id="add-item">+ Add item</button>
      <label for="notes">Notes (optional)</label>
      <input id="notes" placeholder="Thanks for your business.">
      <button type="submit" class="primary" id="submit">Queue job</button>
      <div class="message" id="message"></div>
    </form>
  </section>

  <section>
    <h2>Jobs</h2>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Status</th><th>Invoice</th><th class="wide">Customer</th><th>Stage</th>
                   <th class="wide">Created</th><th>Output</th></tr></thead>
        <tbody id="jobs"></tbody>
      </table>
    </div>
    <div class="empty" id="empty">No jobs yet. Queue one on the left.</div>
    <div id="detail"></div>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
const el = (tag, text, cls) => { const e = document.createElement(tag); if (text != null) e.textContent = text; if (cls) e.className = cls; return e; };
let selected = null;

function addItem(name = "", qty = 1) {
  const row = el("div", null, "row");
  const n = Object.assign(el("input"), { placeholder: "Consulting hour", value: name, required: true });
  const q = Object.assign(el("input"), { type: "number", min: "0.01", step: "0.01", value: qty, required: true });
  const x = Object.assign(el("button", "×"), { type: "button", title: "Remove" });
  x.onclick = () => { if ($("items").children.length > 1) row.remove(); };
  row.append(n, q, x);
  $("items").append(row);
}

function inputsFromForm() {
  const items = [...$("items").children].map((r) => {
    const [name, qty] = r.querySelectorAll("input");
    return { name: name.value.trim(), quantity: Number(qty.value) };
  });
  const invoice = { number: $("number").value.trim(), customer: $("customer").value.trim(),
                    invoice_date: $("date").value, terms: $("terms").value, items };
  if ($("notes").value.trim()) invoice.notes = $("notes").value.trim();
  return { portal: "zoho_invoice", invoice };
}

$("form").onsubmit = async (event) => {
  event.preventDefault();
  $("submit").disabled = true;
  $("message").className = "message";
  $("message").textContent = "Queueing…";
  try {
    const response = await fetch("/api/jobs", { method: "POST", headers: { "Content-Type": "application/json" },
                                                body: JSON.stringify(inputsFromForm()) });
    const body = await response.json();
    if (!response.ok) throw new Error(body.detail || response.statusText);
    $("message").textContent = `Queued job ${body.id}.`;
    selected = body.id;
    refresh();
  } catch (error) {
    $("message").className = "message error";
    $("message").textContent = error.message;
  } finally {
    $("submit").disabled = false;
  }
};

function stageOf(job) {
  if (job.status === "succeeded") return "done";
  if (!job.stages.length) return job.status === "queued" ? "waiting" : "";
  const failed = job.stages.filter((s) => s.status === "failed").pop();
  const last = job.status === "failed" && failed ? failed : job.stages[job.stages.length - 1];
  return last.attempt > 1 ? `${last.key} (attempt ${last.attempt})` : last.key;
}

function renderJobs(jobs) {
  $("empty").style.display = jobs.length ? "none" : "block";
  $("jobs").replaceChildren(...jobs.map((job) => {
    const tr = el("tr");
    if (job.id === selected) tr.className = "selected";
    tr.onclick = () => { selected = job.id; refresh(); };
    const status = el("td"); status.append(el("span", job.status, `badge ${job.status}`));
    const links = el("td", null, "links");
    if (job.document_url) links.append(Object.assign(el("a", "PDF"), { href: job.document_url, target: "_blank" }));
    if (job.manifest_url) links.append(Object.assign(el("a", "manifest"), { href: job.manifest_url, target: "_blank" }));
    tr.append(status, el("td", job.inputs.invoice?.number ?? job.job_key),
              el("td", job.inputs.invoice?.customer ?? "", "wide"), el("td", stageOf(job), "muted"),
              el("td", new Date(job.created_at).toLocaleTimeString(), "muted wide"), links);
    return tr;
  }));
}

async function renderDetail() {
  if (!selected) return $("detail").replaceChildren();
  const response = await fetch(`/api/jobs/${encodeURIComponent(selected)}`);
  if (!response.ok) return;
  const job = await response.json();
  const title = el("h2", `Job ${job.id} · ${job.inputs.invoice?.number ?? ""}`);
  const list = el("ol");
  for (const s of job.stages) {
    const li = el("li");
    li.append(el("span", s.key + " "), el("span", s.status, s.status === "ok" ? "ok" : s.status));
    if (s.attempt > 1) li.append(el("span", ` · attempt ${s.attempt}`, "muted"));
    if (s.duration_ms != null) li.append(el("span", ` · ${(s.duration_ms / 1000).toFixed(1)}s`, "muted"));
    if (s.error) li.append(el("div", s.error, "error-text"));
    list.append(li);
  }
  const parts = [title, job.stages.length ? list : el("div", "Waiting for a worker…", "muted")];
  const shown = new Set(job.stages.map((s) => s.error));
  if (job.error && !shown.has(job.error)) parts.push(el("div", job.error, "error-text"));
  $("detail").replaceChildren(...parts);
}

async function refresh() {
  try {
    const [jobs, health] = await Promise.all([fetch("/api/jobs").then((r) => r.json()),
                                              fetch("/api/health").then((r) => r.json())]);
    renderJobs(jobs);
    $("health").textContent = `${health.running} running · ${health.waiting} waiting · ${health.workers} workers`;
    await renderDetail();
  } catch {
    $("health").textContent = "service unreachable";
  }
}

$("add-item").onclick = () => addItem();
const today = new Date();  // local date, not UTC (toISOString would give yesterday east of UTC)
$("date").value = [today.getFullYear(), today.getMonth() + 1, today.getDate()]
  .map((n) => String(n).padStart(2, "0")).join("-");
addItem();
refresh();
setInterval(refresh, 2000);
</script>
</body>
</html>
